name: flutter_releaser_desktop
description: "Flutter Releaser desktop application to download/upload/test your flutter applications' updates."
publish_to: 'none'
version: 1.2.0
resolution: workspace
homepage: https://github.com/Infumia/flutter_releaser/
repository: https://github.com/Infumia/flutter_releaser/

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.3.0
  flutter_releaser: ^0.4.0
  flutter_releaser_dio: ^0.2.0
  flutter_releaser_flutter: ^0.2.0
  package_info_plus: ^10.2.1
  dio: ^5.11.1
  talker: ^5.1.20
  talker_dio_logger: ^5.1.20

flutter:
  uses-material-design: true
